<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Tracker — Dashboard</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', sans-serif; background:#f5f6fa; }
        .navbar {
            background: #0f3460;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar h2 { color: white; font-size: 16px; }
        .navbar-right { display: flex; gap: 15px; align-items: center; }
        .username-badge { color: #86bc25; font-weight: 600; font-size: 13px; }
        .role-badge {
            background: #555;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .btn-logout {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-logout:hover { background: white; color: #0f3460; }
        .tab-container {
            background: white;
            padding: 0 25px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab-btn {
            display: inline-block;
            padding: 12px 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active { color: #0f3460; border-bottom: 3px solid #0f3460; font-weight: 600; }
        .content { padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card-header h3 { color: #0f3460; font-size: 15px; }
        .domain-select {
            padding: 8px 15px;
            border: 2px solid #0f3460;
            border-radius: 5px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            min-width: 200px;
        }
        .training-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .training-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #0f3460;
        }
        .training-card h4 { color: #0f3460; font-size: 13px; margin-bottom: 5px; }
        .training-card .platform {
            background: #0f3460;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .training-card .est-time {
            color: #86bc25;
            font-size: 11px;
            font-weight: 600;
        }
        .training-card .remark {
            color: #888;
            font-size: 11px;
            margin-top: 3px;
        }
        .training-card a {
            display: inline-block;
            margin-top: 8px;
            color: #0f3460;
            font-size: 12px;
            text-decoration: none;
            font-weight: 600;
        }
        .training-card a:hover { text-decoration: underline; }
        .link-list { list-style: none; }
        .link-list li {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .link-list li:last-child { border-bottom: none; }
        .link-list a {
            color: #0f3460;
            text-decoration: none;
            font-size: 13px;
        }
        .link-list a:hover { text-decoration: underline; }
        .link-topic {
            color: #555;
            font-size: 11px;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .step-card {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 12px 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .step-num {
            background: #0f3460;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }
        .step-info h4 { color: #0f3460; font-size: 13px; }
        .step-info p { color: #666; font-size: 11px; margin-top: 2px; }
        .loading { text-align:center; color:#666; padding:30px; font-size:13px; }
        .error-text { text-align:center; color:#c00; padding:20px; font-size:13px; }
        .domain-hint {
            text-align: center;
            color: #888;
            padding: 30px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>🏢 Team Tracker</h2>
    <div class="navbar-right">
        <span class="username-badge" id="usernameDisplay"></span>
        <span class="role-badge">USER</span>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</div>

<!-- TABS -->
<div class="tab-container">
    <button class="tab-btn active" onclick="showTab('training', event)">Training Links</button>
    <button class="tab-btn" onclick="showTab('onboarding', event)">Onboarding Steps</button>
</div>

<!-- CONTENT -->
<div class="content">

    <!-- TRAINING LINKS -->
    <div class="tab-content active" id="tab-training">
        <div class="card">
            <div class="card-header">
                <h3>Training Resources</h3>
                <select class="domain-select" id="domainSelect" onchange="loadTrainingLinks()">
                    <option value="">-- Select Domain --</option>
                    <option value="Copilot|course">Copilot</option>
                    <option value="AKS|course">AKS</option>
                    <option value="ROVO|course">ROVO</option>
                    <option value="DataDog|course">DataDog</option>
                    <option value="Net|link">.Net</option>
                    <option value="CRM|link">CRM</option>
                    <option value="iOS|link">iOS</option>
                    <option value="ETL|link">ETL</option>
                    <option value="RESRE|link">RESRE</option>
                    <option value="ComplianceTrainingLinks|link">Compliance Training</option>
                </select>
            </div>
            <div id="trainingContent">
                <p class="domain-hint">Please select a domain from the dropdown to view training resources.</p>
            </div>
        </div>
    </div>

    <!-- ONBOARDING STEPS -->
    <div class="tab-content" id="tab-onboarding">
        <div class="card">
            <div class="card-header">
                <h3>Onboarding Steps</h3>
            </div>
            <div id="onboardingStepsList">
                <p class="loading">Loading...</p>
            </div>
        </div>
    </div>

</div>

<script>
const API = 'http://localhost:5289';
const token = localStorage.getItem('token');
const role = localStorage.getItem('role');
const username = localStorage.getItem('username');

if (!token) {
    window.location.href = 'index.html';
}

if (role === 'Admin') {
    window.location.href = 'admin.html';
}

document.getElementById('usernameDisplay')
    .textContent = 'Welcome, ' + username;

function showTab(tabName, event) {
    document.querySelectorAll('.tab-content')
        .forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.tab-btn')
        .forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('tab-' + tabName)
        .classList.add('active');
    event.target.classList.add('active');
    if (tabName === 'onboarding') loadOnboardingSteps();
}

function apiGet(url) {
    return fetch(API + url, {
        headers: { 'Authorization': 'Bearer ' + token }
    }).then(function(r) { return r.json(); });
}

function loadTrainingLinks() {
    var selected = document.getElementById('domainSelect').value;
    if (!selected) return;

    var parts = selected.split('|');
    var domain = parts[0];
    var type = parts[1];

    var container = document.getElementById('trainingContent');
    container.innerHTML = '<p class="loading">Loading...</p>';

    if (type === 'course') {
        apiGet('/api/training/courses/' + domain)
        .then(function(data) {
            if (!data.length) {
                container.innerHTML = '<p class="domain-hint">No training resources found for this domain.</p>';
                return;
            }
            var html = '<div class="training-grid">';
            data.forEach(function(course) {
                html += '<div class="training-card">' +
                    (course.platform ? '<span class="platform">' + course.platform + '</span>' : '') +
                    '<h4>' + (course.title || '') + '</h4>' +
                    (course.estTime ? '<div class="est-time">⏱ ' + course.estTime + '</div>' : '') +
                    (course.remark ? '<div class="remark">' + course.remark + '</div>' : '') +
                    (course.link ? '<a href="' + course.link + '" target="_blank">Open Course →</a>' : '') +
                    '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
        })
        .catch(function() {
            container.innerHTML = '<p class="error-text">Error loading training resources</p>';
        });
    } else {
        apiGet('/api/training/links/' + domain)
        .then(function(data) {
            if (!data.length) {
                container.innerHTML = '<p class="domain-hint">No links found for this domain.</p>';
                return;
            }
            var html = '<ul class="link-list">';
            data.forEach(function(item) {
                html += '<li>' +
                    '<div class="link-topic">' + (item.topic || '') + '</div>' +
                    (item.link ? '<a href="' + item.link + '" target="_blank">' + item.link + '</a>' : 'No link available') +
                    '</li>';
            });
            html += '</ul>';
            container.innerHTML = html;
        })
        .catch(function() {
            container.innerHTML = '<p class="error-text">Error loading links</p>';
        });
    }
}

function loadOnboardingSteps() {
    apiGet('/api/onboarding/steps')
    .then(function(data) {
        var container = document
            .getElementById('onboardingStepsList');
        container.innerHTML = '';
        if (!data.length) {
            container.innerHTML = '<p class="loading">No steps found</p>';
            return;
        }
        data.sort(function(a, b) {
            return a.stepOrder - b.stepOrder;
        });
        data.forEach(function(step) {
            container.innerHTML +=
                '<div class="step-card">' +
                '<div class="step-num">' + step.stepOrder + '</div>' +
                '<div class="step-info">' +
                '<h4>' + step.stepName + '</h4>' +
                '<p>' + (step.description || '') + '</p>' +
                '</div></div>';
        });
    })
    .catch(function() {
        document.getElementById('onboardingStepsList').innerHTML =
            '<p class="error-text">Error loading steps</p>';
    });
}

function logout() {
    localStorage.clear();
    window.location.href = 'index.html';
}
</script>
</body>
</html>
